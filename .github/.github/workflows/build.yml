name: Compilar-Sistema-RG35XXH-Do-Zero

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout do Repositorio
      uses: actions/checkout@v4

    - name: Instalar Dependencias do Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses5-dev libssl-dev \
          sed make binutils g++ bash patch gzip bzip2 perl tar cpio \
          unzip rsync file bc wget git python3 python3-pip xz-utils \
          device-tree-compiler u-boot-tools

    - name: Baixar Buildroot Customizado para RG35XX H
      run: |
        # Clonando o repositório oficial da comunidade que já tem os drivers do portátil
        git clone --depth 1 https://github.com/rg35xx-cfw/buildroot-rg35xx.git buildroot
        cd buildroot
        
        # Carrega a configuração padrão de fábrica para o modelo RG35XX H
        if [ -f configs/rg35xx_h_defconfig ]; then
          make rg35xx_h_defconfig
        elif [ -f configs/anbernic_rg35xx_h_defconfig ]; then
          make anbernic_rg35xx_h_defconfig
        else
          # Fallback automático caso o nome mude
          make $(ls configs/ | grep rg35xx | head -n 1)
        fi

    - name: Injetar Suporte para Wireless e Controles
      run: |
        cd buildroot
        # Força a ativação dos módulos de Wi-Fi, Bluetooth e as ferramentas de mapeamento de botões nativos
        echo "BR2_PACKAGE_RTL8821CS=y" >> .config
        echo "BR2_PACKAGE_BLUEZ5_UTILS=y" >> .config
        echo "BR2_PACKAGE_WPA_SUPPLICANT=y" >> .config
        echo "BR2_PACKAGE_EVTEST=y" >> .config
        echo "BR2_PACKAGE_TRIGGERHAPPY=y" >> .config
        echo "BR2_PACKAGE_RETROARCH=y" >> .config
        
        # Atualiza a configuração com as novas opções inclusas
        make olddefconfig

    - name: Compilar Imagem do Cartao SD (.img)
      run: |
        cd buildroot
        # Compila o sistema operacional inteiro usando a capacidade máxima do servidor
        make -j$(nproc)

    - name: Enviar Imagem Pronta para Download
      uses: actions/upload-artifact@v4
      with:
        name: sistema-completo-rg35xxh
        path: buildroot/output/images/sdcard.img
        if-no-files-found: error
        retention-days: 7
